[package]
name = "phoxal-component-vl53l1x"
version = "0.0.0-dev.9"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false
description = "Phoxal official driver: vl53l1x - range/time-of-flight."
documentation = "https://github.com/phoxal/components#readme"
homepage = "https://github.com/phoxal/components"
repository = "https://github.com/phoxal/components"
include = ["src/**", "build.rs", "Cargo.toml", "Cargo.lock", "component.yaml", "model.xml", "LICENSE", "README.md", ".cargo/config.toml", "clippy.toml"]

[[bin]]
name = "phoxal-component-vl53l1x"
path = "src/main.rs"

[build-dependencies]
phoxal = { version = "0.71.0", default-features = false, features = ["build"] }

[dependencies]
phoxal = { version = "0.71.0", default-features = false, features = ["runtime"] }
anyhow = { version = "1.0.102" }
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
serde_yaml = "0.9.34"
roxmltree = "0.20.0"

[lints.rust]
unused = "warn"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
