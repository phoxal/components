[package]
name = "phoxal-component-ddsm115"
version = "0.0.0-dev.9"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = true
description = "Phoxal official driver: ddsm115 - wheel hub motor."
documentation = "https://github.com/phoxal/components#readme"
homepage = "https://github.com/phoxal/components"
repository = "https://github.com/phoxal/components"
include = ["src/**", "build.rs", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "component.yaml", "model.xml", "assets/**", ".cargo/config.toml", "clippy.toml"]

[[bin]]
name = "phoxal-component-ddsm115"
path = "src/main.rs"

[build-dependencies]
phoxal = { version = "0.70.0", default-features = false, features = ["build"] }

[dependencies]
phoxal = { version = "0.70.0", default-features = false, features = ["runtime"] }
anyhow = { version = "1.0.102" }
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = { version = "1.0.149" }

[lints.rust]
unused = "warn"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
