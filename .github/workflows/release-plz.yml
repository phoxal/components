name: release-plz
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  release-pr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: [bno085, ddsm115, oak_d_lite, vl53l1x, zed_f9p]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
          manifest_path: ${{ matrix.package }}/Cargo.toml
          config: ${{ matrix.package }}/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
