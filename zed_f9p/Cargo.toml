[package]
name = "phoxal-component-zed_f9p"
version = "0.0.0-dev.9"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = ["phoxal"]
description = "Phoxal official driver: zed_f9p - GNSS."
documentation = "https://github.com/phoxal/components#readme"
homepage = "https://github.com/phoxal/components"
repository = "https://github.com/phoxal/components"
include = ["src/**", "build.rs", "Cargo.toml", "Cargo.lock", "component.yaml", "model.xml", "LICENSE", "README.md", ".cargo/config.toml", "clippy.toml"]

[[bin]]
name = "phoxal-component-zed_f9p"
path = "src/main.rs"

[build-dependencies]
phoxal = { version = "=0.0.0-dev.8", registry = "phoxal", default-features = false, features = ["build"] }

[dependencies]
phoxal = { version = "=0.0.0-dev.8", registry = "phoxal", default-features = false, features = ["runtime"] }
anyhow = { version = "1.0.102" }
serde = { version = "1.0.228", features = ["derive"] }

[lints.rust]
unused = "warn"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
